<!DOCTYPE html>
<html>
<head>
    <title>Login - EkpomaRide</title>
    <link rel="stylesheet" href="styling.css">
    <style>
       .auth-container { max-width: 400px; margin: 80px auto; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #333; }
       .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
       .auth-tabs button { flex: 1; padding: 10px; background: #222; color: #fff; border: 1px solid #333; border-radius: 8px; cursor: pointer; }
       .auth-tabs button.active { background: #ffc400; color: #000; font-weight: bold; }
       .auth-form { display: none; }
       .auth-form.active { display: block; }
       .auth-form input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; }
       .auth-form button.submit { width: 100%; padding: 12px; background: #ffc400; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 style="color: #ffc400; text-align: center;">EkpomaRide</h2>

    <div class="auth-tabs">
        <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
        <button id="signupTab" onclick="showForm('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="auth-form active">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="submit">Login</button>
        <p style="text-align:center; margin-top:10px; color:#aaa; font-size:13px;">Don't have account? <span style="color:#ffc400; cursor:pointer;" onclick="showForm('signup')">Sign up</span></p>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="auth-form">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>
        <button type="submit" class="submit">Create Account</button>
        <p style="text-align:center; margin-top:10px; color:#aaa; font-size:13px;">Already have account? <span style="color:#ffc400; cursor:pointer;" onclick="showForm('login')">Login</span></p>
    </form>
</div>

<script>
function showForm(type) {
    document.getElementById('loginForm').classList.remove('active');
    document.getElementById('signupForm').classList.remove('active');
    document.getElementById('loginTab').classList.remove('active');
    document.getElementById('signupTab').classList.remove('active');

    if (type === 'login') {
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('loginTab').classList.add('active');
    } else {
        document.getElementById('signupForm').classList.add('active');
        document.getElementById('signupTab').classList.add('active');
    }
}

// Save new user to localStorage
document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = this.querySelector('input[type="email"]').value;
    const pass = this.querySelectorAll('input[type="password"]')[0].value;
    localStorage.setItem('ekpomaUser', JSON.stringify({email: email, pass: pass}));
    alert('Account created! Now login.');
    showForm('login');
});

document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Logged in! Redirecting to booking...');
    window.location.href = 'booking.html';
});
</script>

<script src="menu.js"></script>
</body>
</html>
